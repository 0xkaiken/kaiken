name: ci-windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows test suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Python test suite
        run: python -X utf8 -m pytest -q tests
      - name: Run JS UI tests
        shell: pwsh
        run: |
          Get-ChildItem tests/*.js | Sort-Object Name | ForEach-Object {
            Write-Host "Running $($_.Name)..."
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Audit HTML/API surface
        run: python -X utf8 tools/api_surface_audit.py
