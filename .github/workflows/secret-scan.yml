name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the full history
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

          # Whole history, once, with our .gitleaks.toml.
          #
          # Deliberately not gitleaks/gitleaks-action@v2: on a push it builds
          # its range as `<first-commit>^..<head>`, and when the first commit
          # of the pushed branch is the repository root, `^` names a revision
          # that does not exist. git exits non-zero, gitleaks scans zero bytes,
          # and the job reports a failure that has nothing to do with secrets.
          # That is exactly what run 44639770508 did - it logged "no leaks
          # found in partial scan" and still went red.
          gitleaks git --redact -v --exit-code=2 \
            --report-format=sarif --report-path=results.sarif .

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif
          if-no-files-found: ignore
